# ── Gramoz Production Deployment Architecture (1 vCPU / 1 GB RAM Enforced Boundary) ──
services:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Edge Reverse Proxy & TLS Termination (Nginx)
  # ────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: gramoz-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - certbot-challenge:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 32M
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge-net

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Production Backend API (NestJS 11 + Fastify)
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: gramoz-backend:latest
    container_name: gramoz-prod-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME}
      DB_POOL_MAX: 10
      DB_POOL_MIN: 2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://gramoz.com}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 384M
        reservations:
          cpus: '0.10'
          memory: 192M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge-net
      - internal-net

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Production Frontend (Next.js 16)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: gramoz-frontend:latest
    container_name: gramoz-prod-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://gramoz.com/api/v1
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - edge-net

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Production Database (PostgreSQL 16)
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gramoz-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD}
    command: >
      postgres 
      -c max_connections=50 
      -c shared_buffers=64MB 
      -c work_mem=4MB 
      -c maintenance_work_mem=16MB 
      -c effective_cache_size=192MB 
      -c checkpoint_completion_target=0.9 
      -c wal_buffers=2MB 
      -c default_statistics_target=100
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 96M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLATFORM_DB_USER} -d ${PLATFORM_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal-net

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Production Cache & Transient State (Redis 7.4)
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: gramoz-prod-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 48mb --maxmemory-policy volatile-lru --save "" --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-prod-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 24M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal-net

# ─────────────────────────────────────────────────────────────────────────────
# Network Topology: Explicit Edge vs Isolated Internal Network
# ─────────────────────────────────────────────────────────────────────────────
networks:
  edge-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true

# ─────────────────────────────────────────────────────────────────────────────
# Persistent Data Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres-prod-data:
    driver: local
  redis-prod-data:
    driver: local
  certbot-challenge:
    driver: local
